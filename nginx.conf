server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Photos: cache for 30 days.
  location /images/ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /manifest.webmanifest { default_type application/manifest+json; }

  # Pages: always revalidate so updates show immediately.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
  }

  error_page 404 /404.html;
}
